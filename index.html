<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TâmAI – Thư chưa từng gửi</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    html {
      scroll-behavior: smooth;
    }
    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s ease-out forwards;
    }
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    #music-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: white;
      border: 2px solid #e91e63;
      color: #e91e63;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 9999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      z-index: 999;
      transition: all 0.3s;
    }
    #music-toggle:hover {
      background: #e91e63;
      color: white;
    }
  </style>
</head>
<body class="font-sans text-gray-800">
  <!-- Background Music -->
  <audio id="bg-music" loop>
    <source src="https://dl.sndup.net/nprw/TamAI-Calm-Ambience.mp3" type="audio/mpeg">
    Trình duyệt của bạn không hỗ trợ audio.
  </audio>
  <button id="music-toggle">🎵 Bật nhạc</button>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const music = document.getElementById('bg-music');
      const musicToggle = document.getElementById('music-toggle');
      let isPlaying = false;

      const playMusic = () => {
        music.muted = false;
        music.play();
        isPlaying = true;
        musicToggle.textContent = '🔇 Tắt nhạc';
      };

      const pauseMusic = () => {
        music.pause();
        isPlaying = false;
        musicToggle.textContent = '🎵 Bật nhạc';
      };

      musicToggle.addEventListener('click', () => {
        isPlaying ? pauseMusic() : playMusic();
      });

      document.addEventListener('click', () => {
        if (!isPlaying) playMusic();
      }, { once: true });

      const form = document.querySelector('form');
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const inputs = form.querySelectorAll('input');
        const name = inputs[0].value.trim();
        const contact = inputs[1].value.trim();

        if (!name || !contact) {
          Swal.fire({
            icon: 'warning',
            title: 'Thiếu thông tin',
            text: 'Vui lòng điền đầy đủ tên và email hoặc SĐT Zalo trước khi gửi.'
          });
          return;
        }

        const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact);
        const isPhone = /^\d{9,11}$/.test(contact);

        if (!isEmail && !isPhone) {
          Swal.fire({
            icon: 'error',
            title: 'Định dạng không hợp lệ',
            text: 'Email phải đúng định dạng hoặc SĐT phải có 9-11 chữ số.'
          });
          return;
        }

        try {
          await fetch("https://script.google.com/macros/s/AKfycbxlWaVcFsfOLPbnUApmd7EiTdClP_Zm0vnweywibl1zgZemvEEd5MHCdSJ8mUvoNXE--A/exec", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, contact })
          });

          Swal.fire({
            icon: 'success',
            title: '✅ Đã gửi thành công!',
            text: 'TâmAI đã nhận được thư của bạn và lưu vào hệ thống.'
          });
          form.reset();
        } catch (error) {
          Swal.fire({
            icon: 'error',
            title: 'Lỗi gửi dữ liệu',
            text: 'Không thể gửi đến Google Sheets. Thử lại sau.'
          });
        }
      });
    });
  </script>
</body>
</html>
